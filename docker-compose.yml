version: '3.8'

services:
  server:
    build: .
    image: thu-vien-server
    container_name: server_thuvien
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "1099:1099"
      - "9999:9999/udp"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
